global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: valkey
    metrics_path: /scrape
    static_configs:
      - targets:
          - valkey://valkey-node-1:6379
          - valkey://valkey-node-2:6379
          - valkey://valkey-node-3:6379
          - valkey://valkey-node-4:6379
          - valkey://valkey-node-5:6379
          - valkey://valkey-node-6:6379
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: valkey-exporter:9121
